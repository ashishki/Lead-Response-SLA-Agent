services:
  api:
    build: .
    command: uvicorn lead_sla_agent.api.app:app --host 0.0.0.0 --port 8000
    environment:
      APP_ENV: ${APP_ENV:?set APP_ENV}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      OPERATOR_AUTH_SECRET: ${OPERATOR_AUTH_SECRET:?set OPERATOR_AUTH_SECRET}
      WEBHOOK_SHARED_SECRET: ${WEBHOOK_SHARED_SECRET:?set WEBHOOK_SHARED_SECRET}
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  worker:
    build: .
    command: python -m lead_sla_agent
    environment:
      APP_ENV: ${APP_ENV:?set APP_ENV}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      EMAIL_API_KEY: ${EMAIL_API_KEY:?set EMAIL_API_KEY}
      EMAIL_SENDER: ${EMAIL_SENDER:?set EMAIL_SENDER}
      EMAIL_API_URL: ${EMAIL_API_URL:?set EMAIL_API_URL}
      CALENDAR_API_TOKEN: ${CALENDAR_API_TOKEN:?set CALENDAR_API_TOKEN}
      CALENDAR_API_URL: ${CALENDAR_API_URL:?set CALENDAR_API_URL}
      CRM_API_TOKEN: ${CRM_API_TOKEN:?set CRM_API_TOKEN}
      CRM_API_URL: ${CRM_API_URL:?set CRM_API_URL}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:?set EMBEDDING_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?set EMBEDDING_MODEL}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:?set EMBEDDING_DIMENSIONS}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:?set EMBEDDING_API_URL}
      MAX_AUTONOMOUS_TURNS: ${MAX_AUTONOMOUS_TURNS:?set MAX_AUTONOMOUS_TURNS}
      MAX_TOOL_CALLS_PER_TURN: ${MAX_TOOL_CALLS_PER_TURN:?set MAX_TOOL_CALLS_PER_TURN}
      MAX_INDEX_AGE_HOURS: ${MAX_INDEX_AGE_HOURS:?set MAX_INDEX_AGE_HOURS}
    depends_on:
      - postgres
      - redis

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

volumes:
  postgres_data:
