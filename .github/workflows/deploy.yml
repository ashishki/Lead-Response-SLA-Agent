name: Deploy

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Deployment target"
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  staging_deploy:
    name: Staging Migration + Smoke
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -e .
      - name: Run staging migrations
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: alembic upgrade head
      - name: Run staging smoke tests
        env:
          APP_ENV: staging
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          REDIS_URL: ${{ secrets.STAGING_REDIS_URL }}
          OPERATOR_AUTH_SECRET: ${{ secrets.STAGING_OPERATOR_AUTH_SECRET }}
          WEBHOOK_SHARED_SECRET: ${{ secrets.STAGING_WEBHOOK_SHARED_SECRET }}
        run: python -m pytest tests/integration/test_health.py tests/integration/test_operator_auth_rbac.py -q --tb=short
      - name: Validate rollback command
        run: test -x scripts/restore_postgres.sh && test -f docs/release_template.md

  production_deploy:
    name: Production Promotion
    runs-on: ubuntu-latest
    needs: staging_deploy
    if: ${{ github.event.inputs.target_environment == 'production' }}
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Confirm release template
        run: test -f docs/release_template.md
      - name: Run production migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: alembic upgrade head
      - name: Run production smoke tests
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          REDIS_URL: ${{ secrets.PRODUCTION_REDIS_URL }}
          OPERATOR_AUTH_SECRET: ${{ secrets.PRODUCTION_OPERATOR_AUTH_SECRET }}
          WEBHOOK_SHARED_SECRET: ${{ secrets.PRODUCTION_WEBHOOK_SHARED_SECRET }}
        run: python -m pytest tests/integration/test_health.py -q --tb=short
      - name: Validate rollback assets
        run: test -x scripts/restore_postgres.sh && test -f docs/runbook.md
