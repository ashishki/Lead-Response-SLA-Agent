name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint_format:
    name: Lint + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -e .
      - name: Lint
        run: ruff check src/lead_sla_agent tests alembic scripts/onboard_tenant.py scripts/reset_demo_tenant.py scripts/smoke_test.py scripts/rollback_check.py
      - name: Format check
        run: ruff format --check src/lead_sla_agent tests alembic scripts/onboard_tenant.py scripts/reset_demo_tenant.py scripts/smoke_test.py scripts/rollback_check.py

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -e .
      - name: Run unit tests
        env:
          APP_ENV: test
          OPERATOR_AUTH_SECRET: test-operator-auth-secret
          WEBHOOK_SHARED_SECRET: test-webhook-secret
        run: python -m pytest tests/unit -q --tb=short

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lead_test
          POSTGRES_PASSWORD: lead_test
          POSTGRES_DB: lead_sla_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -e .
      - name: Run integration tests
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://lead_test:lead_test@localhost:5432/lead_sla_test
          REDIS_URL: redis://localhost:6379/0
          OPERATOR_AUTH_SECRET: test-operator-auth-secret
          WEBHOOK_SHARED_SECRET: test-webhook-secret
          EMAIL_API_KEY: test-email-key
          EMAIL_SENDER: leads@example.test
          EMAIL_API_URL: https://email-provider.example.test/messages
          CALENDAR_API_TOKEN: test-calendar-token
          CALENDAR_API_URL: https://calendar-provider.example.test
          CRM_API_TOKEN: test-crm-token
          CRM_API_URL: https://crm-provider.example.test
          EMBEDDING_API_KEY: test-embedding-key
          EMBEDDING_MODEL: text-embedding-3-small
          EMBEDDING_DIMENSIONS: "1536"
          EMBEDDING_API_URL: https://api.openai.com/v1/embeddings
        run: python -m pytest tests/integration -q --tb=short

  eval:
    name: Eval Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -e .
      - name: Retrieval eval
        run: python -m pytest tests/eval/test_retrieval_eval.py -q --tb=short
      - name: Tool-use eval
        run: python -m pytest tests/eval/test_tool_eval.py -q --tb=short
      - name: Agent eval
        run: python -m pytest tests/eval/test_agent_eval.py -q --tb=short
      - name: Operator feedback eval
        run: python -m pytest tests/eval/test_operator_feedback.py -q --tb=short

  deployment_checks:
    name: Deployment Checks
    runs-on: ubuntu-latest
    needs: [lint_format, unit, integration, eval]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -e .
      - name: Deployment docs and secret policy
        run: python -m pytest tests/unit/test_deployment_docs.py tests/unit/test_deployment_target_docs.py tests/unit/test_secret_policy.py tests/unit/test_rollback_rehearsal.py -q --tb=short
